<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>Game Library</title>
<style>
:root{color-scheme:dark;--bg:#08090d;--panel:#11131b;--line:#252837;--muted:#9ca3b5;--accent:#8b7cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#27204d 0,transparent 38%),var(--bg);color:#f7f7fb;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#090a0ee8;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12}.top{max-width:1400px;margin:auto;padding:20px 26px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:850;letter-spacing:-.05em;font-size:25px}.brand span{color:#a69aff}.sub{color:var(--muted);font-size:13px;margin-top:1px}
.controls{display:flex;gap:10px;flex:1;max-width:620px}input,select{background:#151722;border:1px solid #303344;color:white;border-radius:12px;padding:12px 14px;min-width:0;outline:none}input{flex:1}input:focus,select:focus{border-color:var(--accent)}
main{max-width:1400px;margin:auto;padding:30px 26px 60px}.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:6px 0 24px;flex-wrap:wrap}.hero h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.045em;margin:0 0 5px}.hero p{color:var(--muted);margin:0}.count{color:#c8c1ff;background:#292442;border:1px solid #494070;border-radius:99px;padding:7px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}.card{display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:17px;background:linear-gradient(150deg,#171925,#101117);text-decoration:none;color:inherit;transition:transform .18s,border-color .18s,box-shadow .18s}.card:hover{transform:translateY(-3px);border-color:#7164cc;box-shadow:0 12px 35px #0005}.cover{height:130px;position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#252143,#161925 60%,#30274a)}.cover:before{content:"";position:absolute;width:150px;height:150px;border:1px solid #ffffff18;border-radius:40%;transform:rotate(35deg)}.cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.glyph{font-size:42px;font-weight:900;color:#ffffffb0;letter-spacing:-.08em;text-shadow:0 5px 25px #0008}.cardbody{padding:14px 14px 16px}.name{font-weight:750;line-height:1.3;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:12px;margin-top:7px}.play{display:inline-flex;margin-top:12px;font-size:12px;font-weight:700;color:#c6beff;background:#282343;border-radius:8px;padding:6px 9px}
.state{padding:60px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.error{color:#ffaaa8}.foot{text-align:center;color:#71778a;font-size:12px;padding:28px 0 0}
@media(max-width:600px){.top,main{padding-left:16px;padding-right:16px}.controls{width:100%;max-width:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:105px}.cardbody{padding:11px}.name{font-size:13px}}
</style>
</head>
<body>
<header><div class="top"><div><div class="brand">GAME<span>LIBRARY</span></div><div class="sub">Your collection, all in one place</div></div><div class="controls"><input id="search" type="search" placeholder="Search games…" aria-label="Search games"><select id="sort" aria-label="Sort games"><option value="az">Name A–Z</option><option value="za">Name Z–A</option></select></div></div></header>
<main><section class="hero"><div><h1>Pick your next game.</h1><p>Browse the games stored in this repository. Select any card to launch it.</p></div><div class="count" id="count">Loading library…</div></section><section class="grid" id="grid"><div class="state">Loading games from the repository…</div></section><div class="foot">Game Library · Uses the repository's existing game files and assets</div></main>
<script>
(() => {
const OWNER='Patrickmango49', REPO='game', BRANCH='main';
const API='https://api.github.com/repos/'+OWNER+'/'+REPO;
const ROOT='./';
const grid=document.getElementById('grid'), search=document.getElementById('search'), sort=document.getElementById('sort'), count=document.getElementById('count');
let games=[];
const ignored=new Set(['.git','.github','.vscode','assets','images','img','css','js','fonts','audio','video','build','dist','node_modules']);
const pretty=s=>s.replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
 const q=search.value.trim().toLowerCase();
 let list=games.filter(g=>g.name.toLowerCase().includes(q));
 list.sort((a,b)=>a.name.localeCompare(b.name));
 if(sort.value==='za')list.reverse();
 count.textContent=list.length+' game'+(list.length===1?'':'s');
 if(!list.length){grid.innerHTML='<div class="state">No games match that search.</div>';return}
 grid.innerHTML=list.map(g=>'<a class="card" href="'+esc(g.href)+'" title="Play '+esc(g.name)+'"><div class="cover">'+(g.image?'<img loading="lazy" src="'+esc(g.image)+'" alt="" onerror="this.remove()">':'')+'<span class="glyph">'+esc(g.name.slice(0,2).toUpperCase())+'</span></div><div class="cardbody"><div class="name">'+esc(g.name)+'</div><div class="meta">Game · Repository file</div><span class="play">Play game ↗</span></div></a>').join('');
}
async function load(){
 try{
  const res=await fetch(API+'/contents/?ref='+BRANCH);
  if(!res.ok)throw new Error('GitHub returned '+res.status+'. Try again in a moment.');
  const root=await res.json();
  games=root.filter(x=>x.type==='dir'&&!ignored.has(x.name.toLowerCase())).map(x=>({name:pretty(x.name),path:x.path,href:ROOT+encodePath(x.path)+'/',image:''}));
  // Use each game's existing local assets when available; inspect cards only as they approach view.
  render();
  const observer=new IntersectionObserver(entries=>{
   entries.forEach(entry=>{
    if(!entry.isIntersecting)return;
    observer.unobserve(entry.target);
    const path=entry.target.dataset.path;
    if(!path)return;
    fetch(API+'/contents/'+encodePath(path)+'?ref='+BRANCH).then(r=>r.ok?r.json():[]).then(files=>{
      if(!Array.isArray(files))return;
      const html=files.find(f=>f.type==='file'&&/^index\.html?$/i.test(f.name));
      const entryFile=html||files.find(f=>f.type==='file'&&/^(game|play|main|home)\.html?$/i.test(f.name))||files.find(f=>f.type==='file'&&/\.html?$/i.test(f.name));
      const pic=files.find(f=>f.type==='file'&&/^(thumbnail|thumb|cover|poster|logo|icon|screenshot)[^/]*\.(png|jpe?g|webp|gif|avif)$/i.test(f.name))||files.find(f=>f.type==='file'&&/\.(png|jpe?g|webp|gif|avif)$/i.test(f.name));
      const game=games.find(g=>g.path===path);
      if(game){
       if(entryFile)game.href=ROOT+encodePath(path)+'/'+encodeURIComponent(entryFile.name);
       if(pic)game.image=ROOT+encodePath(path)+'/'+encodeURIComponent(pic.name);
       // Update the visible card without changing the search or scroll position.
       const card=[...grid.querySelectorAll('.card')].find(a=>a.title==='Play '+game.name);
       if(card){card.href=game.href;if(pic){const img=document.createElement('img');img.loading='lazy';img.src=game.image;img.alt='';img.onerror=()=>img.remove();card.querySelector('.cover').prepend(img)}}
      }
    }).catch(()=>{});
   });
  },{rootMargin:'500px'});
  const watch=()=>{grid.querySelectorAll('.card').forEach(card=>{const g=games.find(x=>card.title==='Play '+x.name);if(g&&!g.checked){g.checked=true;card.dataset.path=g.path;observer.observe(card)}})};
  new MutationObserver(watch).observe(grid,{childList:true});
  watch();
 }catch(err){grid.innerHTML='<div class="state error">Could not load the game library.<br>'+esc(err.message)+'<br><br><button onclick="location.reload()">Try again</button></div>';count.textContent='Unavailable'}
}
function encodePath(p){return p.split('/').map(encodeURIComponent).join('/')}
search.addEventListener('input',render);sort.addEventListener('change',render);
load();
})();
</script>
</body></html>
